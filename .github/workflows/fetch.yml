name: Fetch Telegram Configs

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "چاپ لاگ تشخیصی (محتوای خام پیام‌ها)"
        required: false
        default: "0"

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install --upgrade requests beautifulsoup4 lxml

    - name: Run collector script
      env:
        DEBUG: ${{ github.event.inputs.debug || '0' }}
      run: python collect_configs.py

    - name: Commit collected configs
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions@users.noreply.github.com"
        git add output/ all_configs.txt last_index.txt || true
        git commit -m "✅ Update collected configs" || echo "No changes to commit"
        git push || echo "Nothing to push"
