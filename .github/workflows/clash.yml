name: Convert Configs to Clash

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Download and convert configs
        run: |
          cat << 'PYEOF' > convert.py
          import base64
          import re
          import sys
          from urllib.parse import urlparse, parse_qs, unquote
          import requests
          import yaml

          SOURCE_URL = "https://raw.githubusercontent.com/hamedcode/TCC/main/sent_configs.txt"
          OUTPUT_FILE = "clash.yml"

          # ─── Cipher های معتبر Clash/Mihomo ──────────────────────────────────────────
          VALID_SS_CIPHERS = {
              'aes-128-gcm', 'aes-256-gcm',
              'chacha20-ietf-poly1305',
              'aes-128-cfb', 'aes-192-cfb', 'aes-256-cfb',
              'aes-128-ctr', 'aes-192-ctr', 'aes-256-ctr',
              'rc4-md5', 'xchacha20-ietf-poly1305',
              '2022-blake3-aes-128-gcm', '2022-blake3-aes-256-gcm',
              '2022-blake3-chacha20-poly1305',
          }

          # ─── helpers ─────────────────────────────────────────────────────────────────

          def safe_b64decode(s):
              s = s.strip().replace('-', '+').replace('_', '/')
              pad = 4 - len(s) % 4
              if pad != 4:
                  s += '=' * pad
              try:
                  decoded = base64.b64decode(s).decode('utf-8', errors='strict')
                  return decoded
              except Exception:
                  return None

          def has_control_chars(s):
              """برگرداندن True اگه رشته کاراکتر کنترلی داشته باشه."""
              return bool(re.search(r'[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]', str(s)))

          def is_printable_ascii_ish(s):
              """چک کردن اینکه رشته قابل نمایش و بدون کاراکتر مشکل‌ساز باشه."""
              try:
                  s.encode('ascii')
                  return not has_control_chars(s)
              except (UnicodeEncodeError, AttributeError):
                  # کاراکترهای unicode مجازه، فقط control char نباشه
                  return not has_control_chars(s)

          def clean_name(raw):
              name = unquote(raw).strip()
              # حذف کاراکترهای کنترلی
              name = re.sub(r'[\x00-\x1f\x7f]', '', name)
              # جایگزینی فاصله‌های اضافه
              name = re.sub(r'\s+', ' ', name).strip()
              return name or 'proxy'

          def make_unique_name(base, seen):
              if base not in seen:
                  seen.add(base)
                  return base
              i = 2
              while f"{base} {i}" in seen:
                  i += 1
              name = f"{base} {i}"
              seen.add(name)
              return name

          def proxy_is_clean(proxy):
              """چک کردن همه فیلدهای پروکسی برای کاراکتر مشکل‌ساز."""
              def check_value(v):
                  if isinstance(v, str):
                      return not has_control_chars(v)
                  elif isinstance(v, dict):
                      return all(check_value(x) for x in v.values())
                  elif isinstance(v, list):
                      return all(check_value(x) for x in v)
                  return True

              return all(check_value(v) for k, v in proxy.items() if k != 'name')

          # ─── parsers ─────────────────────────────────────────────────────────────────

          def parse_vless(line, seen):
              try:
                  uri, frag = (line.rsplit('#', 1) + ['vless'])[:2] if '#' in line else (line, 'vless')
                  parsed = urlparse(uri)
                  uuid = parsed.username
                  server = parsed.hostname
                  port = parsed.port or 443
                  if not server or not port or not uuid:
                      return None

                  params = parse_qs(parsed.query)
                  def p(k, default=''):
                      return params.get(k, [default])[0]

                  security = p('security', 'none')
                  net_type = p('type', 'tcp')

                  proxy = {
                      'name': make_unique_name(clean_name(frag), seen),
                      'type': 'vless',
                      'server': server,
                      'port': port,
                      'uuid': uuid,
                      'udp': True,
                  }

                  # network type
                  if net_type == 'ws':
                      proxy['network'] = 'ws'
                      ws_opts = {}
                      path = unquote(p('path')) if p('path') else '/'
                      ws_opts['path'] = path
                      if p('host'):
                          ws_opts['headers'] = {'Host': p('host')}
                      proxy['ws-opts'] = ws_opts

                  elif net_type == 'grpc':
                      proxy['network'] = 'grpc'
                      svc = p('serviceName') or p('mode', '')
                      if svc:
                          proxy['grpc-opts'] = {'grpc-service-name': svc}

                  elif net_type == 'tcp' and p('headerType') == 'http':
                      proxy['network'] = 'http'
                      if p('host'):
                          proxy['http-opts'] = {'headers': {'Host': [p('host')]}}

                  elif net_type in ('xhttp', 'httpupgrade'):
                      proxy['network'] = 'http'
                      if p('host'):
                          proxy['http-opts'] = {'headers': {'Host': [p('host')]}}

                  # TLS / Reality
                  if security == 'tls':
                      proxy['tls'] = True
                      if p('sni'):
                          proxy['servername'] = p('sni')
                      if p('fp'):
                          proxy['client-fingerprint'] = p('fp')
                      if p('alpn'):
                          proxy['alpn'] = [a for a in p('alpn').split(',') if a]

                  elif security == 'reality':
                      proxy['tls'] = True
                      pbk = p('pbk', '').strip()
                      sid = p('sid', '').strip()
                      proxy['reality-opts'] = {
                          'public-key': pbk,
                          'short-id': sid,
                      }
                      if p('sni'):
                          proxy['servername'] = p('sni')
                      if p('fp'):
                          proxy['client-fingerprint'] = p('fp')
                      if p('flow'):
                          proxy['flow'] = p('flow')

                  return proxy
              except Exception:
                  return None

          def parse_ss(line, seen):
              """
              Parse Shadowsocks URI.
              فقط cipher های معتبر Clash قبول میشه.
              """
              try:
                  uri, frag = (line.rsplit('#', 1) + ['ss'])[:2] if '#' in line else (line, 'ss')

                  rest = uri[5:]  # حذف ss://
                  at_idx = rest.rfind('@')
                  if at_idx == -1:
                      return None

                  user_part = rest[:at_idx]
                  host_part = rest[at_idx + 1:]

                  # جدا کردن query string
                  host_port = host_part.split('?')[0]
                  qs = host_part.split('?')[1] if '?' in host_part else ''

                  hp = host_port.rsplit(':', 1)
                  if len(hp) != 2:
                      return None
                  server = hp[0].strip('[]')
                  port = int(hp[1])

                  # Decode user_part
                  # فرمت ۱: method:password (plain)
                  # فرمت ۲: BASE64(method:password)
                  # فرمت ۳: BASE64(method:password):plugin_password (2022)
                  method = None
                  password = None

                  if ':' in user_part:
                      # ممکنه plain باشه یا BASE64:extra
                      parts = user_part.split(':', 1)
                      # اگه اولی cipher معتبل باشه → plain
                      if parts[0].lower() in VALID_SS_CIPHERS:
                          method = parts[0].lower()
                          password = parts[1]
                      else:
                          # ممکنه BASE64:extra_pass (برای 2022)
                          decoded = safe_b64decode(parts[0])
                          if decoded and ':' in decoded:
                              sub = decoded.split(':', 1)
                              if sub[0].lower() in VALID_SS_CIPHERS:
                                  method = sub[0].lower()
                                  # برای 2022 فرمت password:plugin_password
                                  password = sub[1] + ':' + parts[1] if len(parts) > 1 else sub[1]
                              else:
                                  return None  # cipher ناشناخته
                          else:
                              return None
                  else:
                      # کل user_part یه BASE64 هست
                      decoded = safe_b64decode(user_part)
                      if not decoded or ':' not in decoded:
                          return None
                      parts = decoded.split(':', 1)
                      if parts[0].lower() not in VALID_SS_CIPHERS:
                          return None
                      method = parts[0].lower()
                      password = parts[1]

                  # اگه cipher معتبل نبود رد کن
                  if method not in VALID_SS_CIPHERS:
                      return None

                  # چک کردن password برای کاراکتر مشکل‌ساز
                  if has_control_chars(password):
                      return None

                  params = parse_qs(qs) if qs else {}
                  def p(k, default=''):
                      return params.get(k, [default])[0]

                  net_type = p('type', 'tcp')
                  security = p('security', 'none')

                  proxy = {
                      'name': make_unique_name(clean_name(frag), seen),
                      'type': 'ss',
                      'server': server,
                      'port': port,
                      'cipher': method,
                      'password': password,
                      'udp': True,
                  }

                  # transport (ws/grpc)
                  if net_type == 'ws':
                      path = unquote(p('path', '/'))
                      host = p('host', server)
                      plugin_opts = {
                          'mode': 'websocket',
                          'path': path,
                      }
                      if host:
                          plugin_opts['headers'] = {'Host': host}
                      if security == 'tls':
                          plugin_opts['tls'] = True
                          if p('sni'):
                              plugin_opts['skip-cert-verify'] = False
                      proxy['plugin'] = 'v2ray-plugin'
                      proxy['plugin-opts'] = plugin_opts

                  elif net_type == 'grpc':
                      proxy['plugin'] = 'v2ray-plugin'
                      proxy['plugin-opts'] = {'mode': 'grpc'}

                  return proxy

              except Exception:
                  return None

          def parse_trojan(line, seen):
              try:
                  uri, frag = (line.rsplit('#', 1) + ['trojan'])[:2] if '#' in line else (line, 'trojan')
                  parsed = urlparse(uri)
                  password = parsed.username
                  server = parsed.hostname
                  port = parsed.port or 443
                  if not server or not port or not password:
                      return None

                  params = parse_qs(parsed.query)
                  def p(k, default=''):
                      return params.get(k, [default])[0]

                  net_type = p('type', 'tcp')

                  proxy = {
                      'name': make_unique_name(clean_name(frag), seen),
                      'type': 'trojan',
                      'server': server,
                      'port': port,
                      'password': password,
                      'udp': True,
                      'skip-cert-verify': p('allowInsecure', '0') == '1' or p('insecure', '0') == '1',
                  }

                  if p('sni'):
                      proxy['sni'] = p('sni')
                  if p('fp'):
                      proxy['client-fingerprint'] = p('fp')
                  if p('alpn'):
                      proxy['alpn'] = [a for a in p('alpn').split(',') if a]

                  if net_type == 'ws':
                      proxy['network'] = 'ws'
                      ws_opts = {}
                      path = unquote(p('path')) if p('path') else '/'
                      # بعضی trojan ها path رو اشتباه URL کامل میذارن
                      if path.startswith('http'):
                          path = '/'
                      ws_opts['path'] = path
                      if p('host'):
                          ws_opts['headers'] = {'Host': p('host')}
                      proxy['ws-opts'] = ws_opts

                  elif net_type == 'grpc':
                      proxy['network'] = 'grpc'
                      if p('serviceName'):
                          proxy['grpc-opts'] = {'grpc-service-name': p('serviceName')}

                  elif net_type in ('xhttp', 'httpupgrade'):
                      proxy['network'] = 'http'

                  return proxy
              except Exception:
                  return None

          # ─── main ────────────────────────────────────────────────────────────────────

          print(f"[*] Downloading configs from {SOURCE_URL}")
          resp = requests.get(SOURCE_URL, timeout=30)
          resp.raise_for_status()
          lines = resp.text.splitlines()
          print(f"[*] Total lines: {len(lines)}")

          proxies = []
          seen_names = set()
          skipped = 0
          rejected_ctrl = 0

          for raw in lines:
              line = raw.strip()
              if not line:
                  continue

              proxy = None
              if line.startswith('vless://'):
                  proxy = parse_vless(line, seen_names)
              elif line.startswith('ss://'):
                  proxy = parse_ss(line, seen_names)
              elif line.startswith('trojan://'):
                  proxy = parse_trojan(line, seen_names)
              else:
                  skipped += 1
                  continue

              if proxy and proxy.get('server') and proxy.get('port'):
                  # فیلتر نهایی: هیچ کاراکتر کنترلی در فیلدها نباشه
                  if proxy_is_clean(proxy):
                      proxies.append(proxy)
                  else:
                      rejected_ctrl += 1
                      print(f"  [!] Rejected (control chars): {proxy.get('name', '?')}")
              else:
                  skipped += 1

          print(f"[*] Parsed OK : {len(proxies)}")
          print(f"[*] Skipped   : {skipped}")
          print(f"[*] Rejected (control chars): {rejected_ctrl}")

          if not proxies:
              print("[!] No valid proxies — aborting")
              sys.exit(1)

          proxy_names = [p['name'] for p in proxies]

          clash_config = {
              'mixed-port': 7890,
              'allow-lan': False,
              'mode': 'rule',
              'log-level': 'info',
              'external-controller': '127.0.0.1:9090',

              'dns': {
                  'enable': True,
                  'ipv6': False,
                  'nameserver': ['8.8.8.8', '1.1.1.1', 'https://dns.google/dns-query'],
                  'fallback': ['tls://1.0.0.1:853', 'tls://8.8.4.4:853'],
              },

              'proxies': proxies,

              'proxy-groups': [
                  {
                      'name': '🚀 Select',
                      'type': 'select',
                      'proxies': ['♻️ Auto'] + proxy_names,
                  },
                  {
                      'name': '♻️ Auto',
                      'type': 'url-test',
                      'proxies': proxy_names,
                      'url': 'http://www.gstatic.com/generate_204',
                      'interval': 300,
                      'tolerance': 50,
                  },
                  {
                      'name': '🎯 Direct',
                      'type': 'select',
                      'proxies': ['DIRECT', 'REJECT'],
                  },
              ],

              'rules': [
                  'GEOIP,IR,DIRECT',
                  'GEOIP,private,DIRECT',
                  'MATCH,🚀 Select',
              ],
          }

          with open(OUTPUT_FILE, 'w', encoding='utf-8') as f:
              yaml.dump(clash_config, f, allow_unicode=True, sort_keys=False, default_flow_style=False)

          print(f"[✓] Written {len(proxies)} proxies to {OUTPUT_FILE}")
          PYEOF
          python convert.py

      - name: Commit and push clash.yml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clash.yml
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: update clash.yml [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
