<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>آخرین کانفیگ‌ها</title>

<style>
    body {
        font-family: sans-serif;
        background: #111;
        color: #eee;
        padding: 20px;
        direction: rtl;
    }
    pre {
        background: #222;
        padding: 15px;
        border-radius: 10px;
        white-space: pre-wrap;
        border: 1px solid #333;
    }
</style>
</head>
<body>

<h2>آخرین کانفیگ‌های ارسال‌شده</h2>
<p>فقط ۲۰ مورد آخر از فایل <code>sent_confings.txt</code></p>

<pre id="output">در حال بارگذاری...</pre>

<script>
fetch("sent_confings.txt")
  .then(r => {
      if (!r.ok) throw new Error("فایل پیدا نشد");
      return r.text();
  })
  .then(text => {
      // تبدیل فایل به خطوط
      let lines = text.trim().split("\n");

      // گرفتن 20 خط آخر
      let lastLines = lines.slice(-20).join("\n");

      document.getElementById("output").innerText = lastLines;
  })
  .catch(err => {
      document.getElementById("output").innerText = "خطا در بارگذاری فایل";
  });
</script>

</body>
</html>
