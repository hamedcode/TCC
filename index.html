<!DOCTYPE html><html lang="fa"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1">
<title>آخرین کانفیگ‌ها</title>
<script src="https://cdn.tailwindcss.com"></script>
</head><body class="bg-black text-white font-sans p-4">
<div class="max-w-2xl mx-auto">
<h2 class="text-xl mb-4 font-bold">۲۰ کانفیگ آخر</h2>

<div id="configBox" class="bg-neutral-900 p-4 rounded-xl overflow-x-auto whitespace-pre-wrap text-sm"></div>

<button onclick="copyText()" class="mt-4 bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded-lg">کپی</button>

</div>

<script>
fetch("sent_configs.txt")
.then(r=>r.text())
.then(t=>{
 let lines=t.trim().split("\n");
 document.getElementById("configBox").innerText = lines.slice(-20).join("\n");
});

function copyText(){
 const t=document.getElementById("configBox").innerText;
 navigator.clipboard.writeText(t);
}
</script>

</body></html>
