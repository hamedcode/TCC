<!DOCTYPE html><html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>آخرین کانفیگ‌ها</title>
<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = { darkMode: "class" }
</script>

<style>
.glass {
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  background: rgba(192,192,192,0.40);
  border: 1px solid rgba(255,255,255,0.35);
}

.dark .glass {
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.15);
}
</style>

</head>

<body class="transition-colors duration-300 bg-gray-100 text-black dark:bg-gradient-to-br dark:from-black dark:via-gray-900 dark:to-black dark:text-white min-h-screen">

<div class="max-w-xl mx-auto px-4 py-8 flex flex-col gap-6">

  <!-- Header -->
  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-bold">۲۰ کانفیگ آخر</h1>
    <button id="themeBtn" class="glass p-2 rounded-xl hover:scale-110 transition">
      <svg id="themeIcon" class="w-6 h-6" fill="none" stroke="currentColor"></svg>
    </button>
  </div>

  <!-- Config box -->
  <div id="configBox"
       class="glass p-4 rounded-2xl text-sm leading-6 whitespace-pre-wrap break-words
              overflow-y-auto overflow-x-hidden max-h-[350px]">
  </div>

  <!-- Copy button -->
  <button onclick="copyText()"
    class="glass py-3 rounded-2xl text-lg hover:bg-white/20 transition">
    کپی کردن کانفیگ‌ها
  </button>

</div>

<script>
// Load last 20 configs
fetch("sent_configs.txt")
  .then(r => r.text())
  .then(text => {
    let lines = text.trim().split("\n");
    document.getElementById("configBox").innerText =
      lines.slice(-20).join("\n");
  });

// Copy box content
function copyText() {
  const t = document.getElementById("configBox").innerText;
  navigator.clipboard.writeText(t);
}

// --- Theme System --- //
const html = document.documentElement;
const themeIcon = document.getElementById("themeIcon");

// Always default to dark unless user changed before
(function initTheme(){
  if (!localStorage.theme) {
    html.classList.add("dark"); // DEFAULT DARK
    localStorage.theme = "dark";
  } else if (localStorage.theme === "dark") {
    html.classList.add("dark");
  } else {
    html.classList.remove("dark");
  }
  updateIcon();
})();

function updateIcon() {
  if (html.classList.contains("dark")) {
    themeIcon.innerHTML =
      `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
      d="M17.293 13.293A8 8 0 016.707 4.707a8.001 8.001 0 1010.586 8.586z"/>`;
  } else {
    themeIcon.innerHTML =
      `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
      d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364-6.364l-1.414 1.414M7.05 
      16.95l-1.414 1.414m12.728 0l-1.414-1.414M7.05 7.05L5.636 5.636"/>`;
  }
}

// Toggle theme
document.getElementById("themeBtn").onclick = () => {
  html.classList.toggle("dark");
  localStorage.theme = html.classList.contains("dark") ? "dark" : "light";
  updateIcon();
};
</script>

</body>
</html>
