<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>آخرین کانفیگ‌ها</title>

<style>
    body {
        font-family: sans-serif;
        background: #111;
        color: #eee;
        direction: rtl;
        margin: 0;
        padding: 0;
        text-align: center;
    }

    .container {
        width: 95%;
        max-width: 900px;
        margin: auto;
        padding: 15px;
    }

    #lastUpdate {
        margin-bottom: 15px;
        font-size: 14px;
        color: #aaa;
    }

    #box {
        background: #222;
        padding: 20px;
        border-radius: 12px;
        border: 1px solid #333;
        text-align: left;
        white-space: pre-wrap;
        overflow-y: auto;
        max-height: 500px;
        font-size: 16px;
    }

    button {
        background: #444;
        color: #fff;
        border: none;
        padding: 12px 25px;
        border-radius: 10px;
        cursor: pointer;
        margin-bottom: 15px;
        font-size: 17px;
        transition: 0.2s;
    }

    button:hover {
        background: #666;
    }

    /* 📱 موبایل */
    @media (max-width: 700px) {
        .container {
            width: 98%;
            padding: 10px;
        }

        #box {
            padding: 15px;
            font-size: 14px;
            max-height: 400px;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
        }

        h2 {
            font-size: 20px;
            margin-top: 10px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h2>آخرین ۲۰ کانفیگ ارسال‌شده</h2>

    <div id="lastUpdate">در حال بررسی زمان آخرین بروزرسانی...</div>

    <button onclick="copyText()">کپی کل کانفیگ‌ها</button>

    <div id="box">در حال بارگذاری...</div>

</div>

<script>
let globalText = "";

// ✔ دریافت زمان آخرین بروزرسانی از GitHub Pages
fetch("sent_configs.txt", { method: "HEAD" })
    .then(res => {
        let lastMod = res.headers.get("Last-Modified");
        if (lastMod) {
            let date = new Date(lastMod);
            document.getElementById("lastUpdate").innerText =
                "آخرین آپدیت فایل: " + date.toLocaleString("fa-IR");
        } else {
            document.getElementById("lastUpdate").innerText =
                "زمان آخرین بروزرسانی در دسترس نیست.";
        }
    });

// ✔ دریافت محتوا + نمایش ۲۰ خط آخر
fetch("sent_configs.txt")
  .then(r => r.text())
  .then(text => {
      let lines = text.trim().split("\n");
      let lastLines = lines.slice(-20).join("\n");

      globalText = lastLines;
      document.getElementById("box").innerText = lastLines;
  })
  .catch(() => {
      document.getElementById("box").innerText = "خطا در بارگذاری فایل";
  });

function copyText() {
    navigator.clipboard.writeText(globalText).then(() => {
        alert("کپی شد!");
    });
}
</script>

</body>
</html>
