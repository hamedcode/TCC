<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>آخرین کانفیگ‌ها</title>

<style>
    body {
        font-family: sans-serif;
        background: #111;
        color: #eee;
        padding: 20px;
        direction: rtl;
        text-align: center;
    }

    .container {
        max-width: 800px;
        margin: auto;
    }

    #box {
        background: #222;
        padding: 20px;
        border-radius: 12px;
        border: 1px solid #333;
        text-align: left;
        white-space: pre-wrap;
        overflow-y: auto;
        max-height: 500px;
    }

    button {
        background: #444;
        color: #fff;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 15px;
        transition: 0.2s;
    }

    button:hover {
        background: #666;
    }
</style>
</head>

<body>

<div class="container">
    <h2>آخرین ۲۰ کانفیگ ارسال‌شده</h2>

    <button onclick="copyText()">کپی کل کانفیگ‌ها</button>

    <div id="box">در حال بارگذاری...</div>
</div>

<script>
let globalText = ""; // ذخیره برای کپی

fetch("sent_configs.txt")
  .then(r => r.text())
  .then(text => {
      let lines = text.trim().split("\n");
      let lastLines = lines.slice(-20).join("\n");

      globalText = lastLines;
      document.getElementById("box").innerText = lastLines;
  })
  .catch(() => {
      document.getElementById("box").innerText = "خطا در بارگذاری فایل";
  });

function copyText() {
    navigator.clipboard.writeText(globalText).then(() => {
        alert("کپی شد!");
    });
}
</script>

</body>
</html>
