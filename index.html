<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>آخرین کانفیگ‌ها</title>

<style>
    body {
        font-family: sans-serif;
        background: #111;
        color: #eee;
        padding: 20px;
        direction: rtl;
        text-align: center;
        margin: 0;
    }

    .container {
        width: 100%;
        max-width: 900px;
        margin: auto;
        padding: 10px;
    }

    #box {
        background: #222;
        padding: 20px;
        border-radius: 12px;
        border: 1px solid #333;
        text-align: left;
        white-space: pre-wrap;
        overflow-y: auto;
        max-height: 500px;
        font-size: 15px;
    }

    button {
        background: #444;
        color: #fff;
        border: none;
        padding: 12px 25px;
        border-radius: 10px;
        cursor: pointer;
        margin-bottom: 15px;
        font-size: 16px;
        transition: 0.2s;
    }

    button:hover {
        background: #666;
    }

    /* 📱 موبایل */
    @media (max-width: 600px) {
        body {
            padding: 10px;
        }

        h2 {
            font-size: 20px;
        }

        #box {
            padding: 15px;
            font-size: 14px;
            max-height: 400px;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
        }
    }
</style>
</head>

<body>

<div class="container">
    <h2>آخرین ۲۰ کانفیگ ارسال‌شده</h2>

    <button onclick="copyText()">کپی کل کانفیگ‌ها</button>

    <div id="box">در حال بارگذاری...</div>
</div>

<script>
let globalText = "";

fetch("sent_configs.txt")
  .then(r => r.text())
  .then(text => {
      let lines = text.trim().split("\n");
      let lastLines = lines.slice(-20).join("\n");

      globalText = lastLines;
      document.getElementById("box").innerText = lastLines;
  })
  .catch(() => {
      document.getElementById("box").innerText = "خطا در بارگذاری فایل";
  });

function copyText() {
    navigator.clipboard.writeText(globalText).then(() => {
        alert("کپی شد!");
    });
}
</script>

</body>
</html>
